# -----------------------------------------------------------------------------
# Stage-3 half of the smoke test. Run smoke.yaml then smoke2.yaml first:
#
#   python -m src.training.train --config configs/smoke3.yaml \
#       --init-from /scratch/er8/cd3022/CPDiT_smoke/checkpoints_stage2/best_model.pt
#
# Exercises the one configuration where the diffusion gradient reaches the
# encoder, so both guards are on: latent_norm batch and a pixel loss.
# -----------------------------------------------------------------------------

extends: smoke2.yaml

model:
  latent_norm: batch
  latent_scale: null
  latent_scale_momentum: 0.9

training:
  vae_loss_weight: 0.5
  diffusion_loss_weight: 1.0
  freeze_vae: false
  detach_latents: false
  pixel_loss_weight: 0.05
  pixel_loss_max_t: 0.3
  vae_lr_mult: 0.1
  vae_max_frames: 3
  vae_beta: 1.0e-6
  vae_ssim_weight: 0.5
  checkpoint_dir: /scratch/er8/cd3022/CPDiT_smoke/checkpoints_stage3/

dataloader:
  batch_size: 8
