# Atmos: adds BARRA variables to the baseline config

data:
  himawari_vars:
    - surface_global_irradiance
    - solar_elevation
  himawari_bands: []
  barra_vars: 
    - KI        # k-index = T850 - T500 + Td850 - (T700 - Td700)
    - hus500    # 500 hPa specific humidity
    - TCD       # Total cloud depth = equillibrium level - lifting condensation level
    - zg500     # 500 hPa geopotential height