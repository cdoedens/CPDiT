# Radiance: include himawari bands in addition to the baseline config

data:
  himawari_vars:
    - surface_global_irradiance
    - solar_elevation
  himawari_bands:
    - OBS_B04     # 0.86 µm
    - OBS_B06     # 2.3 µm
    - OBS_B08     # 6.2 µm
    - OBS_B09     # 6.9 µm
    - OBS_B10     # 7.3 µm
    - OBS_B13     # 10.4 µm
  barra_vars: []
