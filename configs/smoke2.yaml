# -----------------------------------------------------------------------------
# Stage-2 half of the smoke test. Run configs/smoke.yaml first, then:
#
#   python -m src.training.train --config configs/smoke2.yaml \
#       --init-from /scratch/er8/cd3022/CPDiT_smoke/checkpoints/best_model.pt
#
# Same short cached range; stage-2 settings inherited from train_config.yaml.
# -----------------------------------------------------------------------------

extends: smoke.yaml

model:
  # From scripts/measure_latent_scale.py on the smoke stage-1 checkpoint.
  # Pinned, so --init-from cannot overwrite it with the checkpoint's own EMA.
  latent_scale: 2.74854

training:
  # Back to stage 2: frozen VAE, diffusion only.
  vae_loss_weight: 0.0
  diffusion_loss_weight: 1.0
  freeze_vae: true
  vae_max_frames: null
  checkpoint_dir: /scratch/er8/cd3022/CPDiT_smoke/checkpoints_stage2/
  early_stopping:
    enabled: false
    # Back to the forecast metric: smoke.yaml's recon_loss is identically zero
    # once vae_loss_weight is 0, so best-model selection would freeze on epoch 1.
    monitor: forecast_rmse

evaluation:
  forecast_eval_batches: 2
  num_steps: 20
  max_val_batches: 8
