
model:
  image_channels: 2
  image_size: 256                # Spatial size of input patches (H = W)
  latent_channels: 4              
  hidden_dim: 128                # VAE conv base channel width (D → 2D → 4D)

  

  transformer:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 1024
    transformer_dim: 512        # Irradiance token dimension (AdaLN transformer stream)
    barra_token_dim: 128          # NWP auxiliary context token dimension (cross-attention)
    dropout: 0.1
    max_seq_len: 64

  diffusion:
    num_steps: 1000
    embed_dim:   768
    num_blocks:  16
    num_heads:   12
    window_size: 31
    ffn_mult:    4
    cond_dim:    256
    
    denoiser_hidden_dim: 128    # Recommended: 128 or 256 — 512 is very memory-heavy
    denoiser_heads: 4           # Attention heads in denoiser ContextCrossAttention blocks
    beta_schedule: cosine


  inference:
    ddim_steps: 50               # Denoising steps at inference (~20x faster than DDPM)
    eta: 0.0                     # 0.0 = deterministic, 1.0 = stochastic DDPM
    num_ensemble_members: 1      # Set >1 to generate probabilistic ensembles


data:
  sat_timestep: "10 minutes"
  bar_timestep: "1 hour" # for iterator
  sat_norm: 1200
  barra_norm: 100
  n_prior_sat: 12
  n_post: 1
  bounds:       [-35, -28.5, 145, 151.5]
  inner_bounds: [-34.4, -29.3, 146.1, 151.2]
  barra_domain: "AUST-11"
  barra_freq:   "1hr" # for file path
  himawari_vars:
    - surface_global_irradiance
    # - solar_elevation
  barra_vars:
    - RH24mean
  splits:
    train:
      start:    "20200101T0000"
      end:      "20210101T0000"
      ref_date: "20200101T0000"
    val:
      start:    "20210101T0000"
      end:      "20220101T0000"
      ref_date: "20210101T0000"

dataloader:
  batch_size: 1
  pin_memory: true

  stats:
    combined:            /scratch/er8/cd3022/CPDiT/stats/combined_stats.json
    quantile_transforms: /scratch/er8/cd3022/CPDiT/stats/quantile_transforms.pkl


  # DataLoader settings
  num_workers: 0
  pin_memory: true
  prefetch_factor: 2             # Batches to prefetch per worker


training:
  compile_model: False            # Set to false when debugging/diagnosing issues for better tracebacks
  checkpoint: /scratch/er8/cd3022/CPDiT/checkpoints/checkpoint_epoch_050.pt
  seed: 42
  mixed_precision: true          # Uses torch.cuda.amp automatically

  batch_size: 1

  # Epochs
  max_epochs: 100

  early_stopping:
    enabled: true
    patience: 10                 # Epochs without improvement before stopping
    monitor: val_loss            # Metric to monitor

  # Gradient clipping — important for transformer stability
  gradient_clip_norm: 1.0
  vae_beta: 0.01                     # KL loss weight for VAE training
  vae_ssim_weight: 0.1               # SSIM loss weight for VAE training



  # Checkpoint settings
  checkpoint_dir: /scratch/er8/cd3022/CPDiT/testing_checkpoints/
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 3
  resume_from: null              # Set to a checkpoint path to resume training

  log_dir: /scratch/er8/cd3022/CPDiT/logs/

# -----------------------------------------------------------------------------
# Optimiser
# -----------------------------------------------------------------------------
optimiser:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]


  scheduler:
    name: cosine_annealing      # Smooth LR decay over training
    warmup_epochs: 5            # Linear warmup from 0 to lr over first 5 epochs
    min_lr: 1.0e-6              # Floor for cosine decay

# -----------------------------------------------------------------------------
# Logging and evaluation
# -----------------------------------------------------------------------------
logging:
  project_name: CPDiT
  experiment_name: 256px_12ctx_6fcast
  log_dir: /scratch/er8/cd3022/CPDiT/logs/
  log_every_n_steps: 50

  # Metrics to track at validation time
  metrics:
    - mse
    - mae
    - ssim                      # Structural similarity — better for image quality
    - crps                      # Continuous ranked probability score for ensembles

  # Log sample forecast images to wandb/tensorboard every N epochs
  visualise_every_n_epochs: 5
  num_visualisation_samples: 4  # Number of sequences to visualise

# -----------------------------------------------------------------------------
# HPC / Gadi job settings
# (used by scripts/train.pbs to set resource requests)
# -----------------------------------------------------------------------------
hpc:
  ncpus: 8
  ngpus: 4
  mem_gb: 128
  walltime: "48:00:00"
  queue: gpuvolta
  project: er8
  modules:
    - cuda/12.2
    - python3/3.11
